<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sổ Từ</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1f2a28; --muted: #6b7471; --line: #e6e2d9; --accent: #0f766e; --accent-fg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171c1b; --fg: #ece8df; --muted: #9aa39f; --line: #2c3432; --accent: #2bb3a2; --accent-fg: #0b1211; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 290px; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { padding: 14px 16px 16px; }
  h1 { margin: 0; font: 600 18px/1.2 "Noto Serif", Cambria, "Times New Roman", serif; }
  .stats { margin: 4px 0 12px; color: var(--muted); }
  .stats b { color: var(--fg); }
  label { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .open { width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
  .open.secondary { margin-top: 8px; background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .hint { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
  kbd { font: 11px ui-monospace, Consolas, monospace; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sổ Từ</h1>
  <p class="stats" id="stats">…</p>
  <label>Bật trên các trang <input type="checkbox" id="enabled"></label>
  <label>Hiện nút lưu khi bôi đen <input type="checkbox" id="showSaveButton"></label>
  <button class="open" id="study">Ôn tập</button>
  <button class="open secondary" id="open">Mở Sổ Từ</button>
  <p class="hint">Double-click: lưu từ · Triple-click: lưu đoạn · Bôi đen rồi bấm <b>+ Sổ Từ</b> hoặc <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>: lưu cụm từ.</p>
</div>
<script src="lib.js"></script>
<script src="popup.js"></script>
</body>
</html>
